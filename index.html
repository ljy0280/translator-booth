<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中亚六语实时互译语音台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
         background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 16px; max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.3rem; text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; color: #94a3b8; font-size: .8rem; margin-bottom: 16px; }
  .card { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: .8rem; color: #94a3b8; margin-bottom: 6px; }
  select, textarea, input[type=password], input[type=text] { width: 100%; background: #0f172a; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 1rem; }
  textarea { min-height: 90px; resize: vertical; margin-top: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  button { border: none; border-radius: 10px; padding: 14px 18px; font-size: 1rem;
    cursor: pointer; font-weight: 600; }
  .btn-mic  { background: #dc2626; color: #fff; width: 100%; }
  .btn-mic.on { background: #16a34a; }
  .btn-go   { background: #2563eb; color: #fff; width: 100%; margin-top: 10px; }
  .btn-play { background: #0891b2; color: #fff; flex: 1; }
  .btn-stop { background: #475569; color: #fff; flex: 1; }
  .btn-ghost{ background: #334155; color: #e2e8f0; padding: 8px 16px; font-size: .85rem; }
  .hint { font-size: .78rem; color: #94a3b8; margin-top: 8px; line-height: 1.6; }
  .warn { color: #fbbf24; }
  .err  { color: #f87171; }
  .ok   { color: #4ade80; }
  .transcript { background: #0f172a; border: 1px dashed #475569; border-radius: 8px;
    padding: 10px; min-height: 56px; margin-top: 10px; font-size: 1rem; white-space: pre-wrap; }
  .swap { text-align: center; margin: 8px 0; }
  .keyrow { display: flex; gap: 8px; align-items: center; }
  .keyrow input { flex: 1; }
  .pill { display:inline-block; background:#0f172a; border:1px solid #334155; border-radius:999px;
    padding: 4px 12px; font-size: .75rem; color:#94a3b8; margin: 2px 4px 2px 0; }
  .auto { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: .85rem; color: #94a3b8; }
</style>
</head>
<body>
<h1>🎙️ 中亚六语实时互译语音台</h1>
<div class="sub">中文 · 俄语 · 哈萨克语 · 乌兹别克语 · 塔吉克语 · 土库曼语 —— 直接调用 Kimi 翻译</div>

<div class="card">
  <label>Kimi API Key（仅在浏览器本地保存，不上传任何服务器；platform.moonshot.cn 获取）</label>
  <div class="keyrow">
    <input type="password" id="apikey" placeholder="sk-...">
    <button class="btn-ghost" onclick="saveKey()">保存</button>
    <button class="btn-ghost" onclick="forgetKey()">清除</button>
  </div>
  <div class="row" style="margin-top:10px">
    <div><label>模型</label>
      <select id="model">
        <option value="kimi-k2-0905-preview">kimi-k2-0905（推荐）</option>
        <option value="kimi-k2-turbo-preview">kimi-k2-turbo（更快）</option>
        <option value="moonshot-v1-8k">moonshot-v1-8k（便宜）</option>
      </select></div>
    <div><label>语音播报目标语译文</label>
      <div class="auto"><input type="checkbox" id="autoSpeak" checked style="width:auto"> 翻译完成后自动播报</div></div>
  </div>
  <div class="hint" id="keyStatus"></div>
</div>

<div class="card">
  <div class="row">
    <div><label>我说（A 语）</label>
      <select id="langA">
        <option value="zh">中文</option>
        <option value="ru">Русский 俄语</option>
        <option value="kk">Қазақша 哈萨克语</option>
        <option value="uz">O'zbekcha 乌兹别克语</option>
        <option value="tg">Тоҷикӣ 塔吉克语</option>
        <option value="tk">Türkmençe 土库曼语</option>
      </select></div>
    <div class="swap"><button class="btn-ghost" onclick="swapLangs()">⇄ 交换</button></div>
    <div><label>对方听（B 语，AI 翻译目标）</label>
      <select id="langB">
        <option value="ru" selected>Русский 俄语</option>
        <option value="zh">中文</option>
        <option value="kk">Қазақша 哈萨克语</option>
        <option value="uz">O'zbekcha 乌兹别克语</option>
        <option value="tg">Тоҷикӣ 塔吉克语</option>
        <option value="tk">Türkmençe 土库曼语</option>
      </select></div>
  </div>
</div>

<div class="card">
  <label>第一步 · 我说 A 语</label>
  <button id="micBtn" class="btn-mic">● 开始说话（自动识别）</button>
  <div class="transcript" id="heard">（识别结果会显示在这里，也可以直接打字输入）</div>
  <textarea id="manualA" placeholder="也可以在这里手动输入 A 语文字…"></textarea>
  <div class="hint" id="sttHint"></div>
  <button class="btn-go" id="goBtn" onclick="translateNow()">⚡ 翻译并播报</button>
  <div class="hint" style="margin-top:10px">
    <span class="pill">捷径：说完点「翻译并播报」，约 1–3 秒出译文并自动朗读</span>
    <span class="pill">方向反过来时，点顶部「⇄ 交换」再让对方说</span>
  </div>
</div>

<div class="card">
  <label>B 语译文（AI 实时返回）</label>
  <textarea id="textB" placeholder="译文会实时出现在这里…"></textarea>
  <div class="row" style="margin-top:10px">
    <button class="btn-play" onclick="speakB()">🔊 重播 B 语</button>
    <button class="btn-stop" onclick="stopSpeak()">⏹ 停止播报</button>
    <button class="btn-ghost" onclick="copyB()">📋 复制译文</button>
  </div>
  <div class="hint" id="ttsHint"></div>
  <div class="hint" id="transStatus"></div>
</div>

<script>
const RECOG = { zh:'zh-CN', ru:'ru-RU', kk:'kk-KZ', uz:'uz-UZ', tg:null, tk:null };
const NAMES = { zh:'中文', ru:'俄语', kk:'哈萨克语', uz:'乌兹别克语', tg:'塔吉克语', tk:'土库曼语' };
const $ = id => document.getElementById(id);
const getA = () => $('langA').value, getB = () => $('langB').value;
let rec = null, recOn = false;

/* ---------- API key ---------- */
function loadKey(){ const k = localStorage.getItem('kimi_key') || ''; $('apikey').value = k; keyHint(); }
function saveKey(){ localStorage.setItem('kimi_key', $('apikey').value.trim()); keyHint('已保存到本机浏览器。'); }
function forgetKey(){ localStorage.removeItem('kimi_key'); $('apikey').value=''; keyHint('已清除。'); }
function keyHint(msg){
  const has = !!localStorage.getItem('kimi_key');
  $('keyStatus').innerHTML = (msg ? msg + ' ' : '') +
    (has ? '<span class="ok">✓ 已配置 Key，可直接翻译。</span>'
         : '<span class="warn">未配置 Key：可在 platform.moonshot.cn 创建，填入后保存即可本机使用。</span>');
}
loadKey();

/* ---------- language UI ---------- */
function swapLangs(){ const a=$('langA'), b=$('langB'); const t=a.value; a.value=b.value; b.value=t; refreshHints(); }
function refreshHints(){
  const a=getA(), b=getB();
  $('sttHint').innerHTML = RECOG[a]
    ? '浏览器可识别「' + NAMES[a] + '」语音（Chrome/Edge 效果最佳，需联网）。'
    : '<span class="warn">⚠ 浏览器暂不支持' + NAMES[a] + '语音识别，请手动输入文字。</span>';
  $('ttsHint').innerHTML = '播报使用浏览器语音合成（' + NAMES[b] + '）。塔/土语播报取决于系统语音包，不佳时建议用俄语播报。';
}

/* ---------- speech recognition ---------- */
$('micBtn').onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('当前浏览器不支持语音识别，请使用 Chrome 或 Edge，或直接打字输入。'); return; }
  if(recOn){ rec.stop(); return; }
  const code = RECOG[getA()];
  if(!code){ alert('该语言暂不支持浏览器语音识别，请使用手动输入。'); return; }
  rec = new SR(); rec.lang = code; rec.interimResults = true; rec.continuous = false;
  let final = '';
  rec.onresult = e => {
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    $('heard').textContent = (final+interim).trim() || '（识别结果会显示在这里）';
    $('manualA').value = final.trim();
  };
  rec.onend = () => {
    recOn=false; $('micBtn').classList.remove('on'); $('micBtn').textContent='● 开始说话（自动识别）';
    const t = currentText();
    if(t && localStorage.getItem('kimi_key')) translateNow();
  };
  rec.onerror = ev => { alert('识别出错：'+ev.error); recOn=false; $('micBtn').classList.remove('on'); };
  rec.start(); recOn=true;
  $('micBtn').classList.add('on'); $('micBtn').textContent='■ 停止说话';
};
function currentText(){ return $('manualA').value.trim() || $('heard').textContent.trim(); }

/* ---------- Kimi translation (streaming) ---------- */
let translating = false, retryCount = 0;
async function translateNow(){
  if(translating){ return; } /* 防止语音识别自动触发与手动点击重复提交 */
  const text = currentText();
  if(!text || text.indexOf('识别结果')===0){ alert('请先说话识别或手动输入内容。'); return; }
  const key = localStorage.getItem('kimi_key');
  if(!key){ alert('请先在顶部填入并保存 Kimi API Key。'); return; }
  translating = true;
  const btn = $('goBtn'); btn.disabled = true; btn.textContent = '⏳ 翻译中…';
  $('transStatus').innerHTML = '<span class="ok">正在调用 Kimi…</span>';
  $('textB').value = '';
  try {
    const resp = await fetch('https://api.moonshot.cn/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model: $('model').value,
        temperature: 0.3,
        stream: true,
        messages: [
          { role: 'system', content: '你是专业口译员。把用户给的' + NAMES[getA()] + '文字翻译成' + NAMES[getB()] +
            '。只输出译文本身：口语化、短句、适合朗读，不要解释、不要引号、不要原文对照。人名地名按目标语惯用译名。' },
          { role: 'user', content: text }
        ]
      })
    });
    if(!resp.ok){
      const err = await resp.text();
      throw new Error('API ' + resp.status + '：' + err.slice(0, 300));
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', out = '';
    for(;;){
      const { done, value } = await reader.read();
      if(done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for(const line of lines){
        const s = line.trim();
        if(!s.startsWith('data:')) continue;
        const payload = s.slice(5).trim();
        if(payload === '[DONE]') continue;
        try {
          const json = JSON.parse(payload);
          const delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
          if(delta){ out += delta; $('textB').value = out; $('textB').scrollTop = 1e9; }
        } catch(e){}
      }
    }
    $('transStatus').innerHTML = '<span class="ok">✓ 翻译完成</span>';
    retryCount = 0;
    if($('autoSpeak').checked && out.trim()) speakB();
  } catch(e){
    const msg = String(e.message || e);
    const m = msg.match(/try again after (\d+) seconds/);
    if(/429|rate_limit/i.test(msg) && retryCount < 2){
      retryCount++;
      const wait = m ? (parseInt(m[1]) + 2) : 4;
      $('transStatus').innerHTML = '<span class="warn">请求太频繁（账户限流），' + wait + ' 秒后自动重试（第 ' + retryCount + '/2 次）…</span>';
      translating = false; btn.disabled = false;
      setTimeout(translateNow, wait * 1000);
      return;
    }
    retryCount = 0;
    $('transStatus').innerHTML = '<span class="err">出错：' + msg.replace(/</g,'&lt;') + '</span>';
  } finally {
    if(translating){ translating = false; btn.disabled = false; btn.textContent = '⚡ 翻译并播报'; }
  }
}

/* ---------- TTS ---------- */
function speakB(){
  const t = $('textB').value.trim();
  if(!t){ alert('暂无译文可播报。'); return; }
  stopSpeak();
  const u = new SpeechSynthesisUtterance(t);
  const want = getB();
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith(want));
  if(vs.length) u.voice = vs[0];
  u.lang = vs.length ? vs[0].lang : want;
  speechSynthesis.speak(u);
}
function stopSpeak(){ speechSynthesis.cancel(); }
function copyB(){
  const t = $('textB').value.trim();
  if(!t){ alert('暂无译文可复制。'); return; }
  navigator.clipboard.writeText(t).then(()=>alert('译文已复制。')).catch(()=>alert('复制失败，请手动选择复制。'));
}

speechSynthesis.onvoiceschanged = refreshHints;
refreshHints();
</script>
</body>
</html>
